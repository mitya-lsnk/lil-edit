name: build

# Produces installers for Windows and macOS. Run it by hand from the Actions
# tab (workflow_dispatch), or push a tag like v0.1.0. Each run uploads the
# installers as downloadable artifacts; a tag also drafts a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write


    steps:
      - uses: actions/checkout@v4

      # The local `.cargo/config.toml` redirects builds into `target.noindex`
      # so Spotlight ignores ~11 GB of intermediates on a Mac. On a runner that
      # only causes trouble: tauri-action resolves where the bundles landed from
      # cargo's own metadata, and any override made the two disagree — the build
      # succeeded and then "No artifacts were found". Deleting the file leaves
      # everything on the default `src-tauri/target`, which is what the upload
      # globs and tauri-action both expect.
      - name: Use the default target directory
        # Explicit bash: the default shell on a Windows runner is PowerShell,
        # where `rm` is an alias for Remove-Item and `-f` is ambiguous between
        # -Filter and -Force.
        shell: bash
        run: rm -f src-tauri/.cargo/config.toml


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      # Builds the frontend (beforeBuildCommand) then the Tauri bundles.
      # With a tag, this also drafts a Release with the installers attached.
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "lil edit ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Always expose the installers as run artifacts, so a manual run (no tag)
      # still gives the tester something to download.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lil-edit-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
