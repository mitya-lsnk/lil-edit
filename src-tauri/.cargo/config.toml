# Build into "target.noindex" rather than "target".
#
# Spotlight skips any directory whose name ends in .noindex, and nothing else
# does. Without this, every build leaves a "lil edit.app" and a pile of
# lil-edit-<hash> folders in the index, so searching for the app turns up the
# installed copy mixed with build leftovers. (.metadata_never_index does not
# help here — it only applies at the root of a volume.)
[build]
target-dir = "target.noindex"
